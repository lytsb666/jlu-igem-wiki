<body>
<div id="jlu-team-concept-v1" aria-label="JLU-SPH Team design preview">
  <style>
    #jlu-team-concept-v1 { --jlu-ink:#6f4e37; --jlu-tan:#e0c1a6; --jlu-paper:#fbf5ef; --jlu-line:#a97652; --jlu-brown:#9a6742; --jlu-view-height:680px; --jlu-avatar:132px; --jlu-title-border:2px; color:var(--jlu-ink); font:16px/1.6 "Times New Roman",Times,serif; width:100%; container-type:inline-size; }
    #jlu-team-concept-v1 * { box-sizing:border-box; }
    #jlu-team-concept-v1 button,#jlu-team-concept-v1 a,#jlu-team-concept-v1 summary { font:inherit; }
    #jlu-team-concept-v1 button { cursor:pointer; }
    #jlu-team-concept-v1 img { display:block; max-width:100%; }
    #jlu-team-concept-v1 .jlu-scroll { position:relative; height:var(--jlu-view-height); overflow-y:auto; overflow-x:hidden; background:var(--jlu-tan); scrollbar-color:var(--jlu-brown) var(--jlu-tan); scroll-behavior:smooth; scroll-padding-top:72px; }
    #jlu-team-concept-v1 .jlu-nav { position:sticky; top:0; z-index:30; height:54px; margin-bottom:-54px; display:flex; align-items:center; justify-content:center; gap:clamp(12px,2cqw,30px); padding:0 18px; background:#8d6b50; color:#fffaf5; white-space:nowrap; overflow:auto; }
    #jlu-team-concept-v1 .jlu-nav span { padding:12px 0 8px; }
    #jlu-team-concept-v1 .jlu-nav .jlu-nav-active { border-bottom:1px solid #f3d6ad; }
    #jlu-team-concept-v1 .jlu-hero-runway { height:calc(var(--jlu-view-height) * 1.38); }
    #jlu-team-concept-v1 .jlu-hero { position:sticky; top:0; height:var(--jlu-hero-height,var(--jlu-view-height)); overflow:hidden; isolation:isolate; background:#c6a58b; }
    #jlu-team-concept-v1 .jlu-group-backdrop { position:absolute; inset:-30px; width:calc(100% + 60px); height:calc(100% + 60px); object-fit:cover; filter:blur(24px); opacity:.45; z-index:-1; }
    #jlu-team-concept-v1 .jlu-group-photo { width:100%; height:calc(100% - 54px); margin-top:54px; object-fit:contain; object-position:center; }
    #jlu-team-concept-v1 .jlu-hero-shade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(41,26,17,.12),transparent 35%,transparent 60%,rgba(41,26,17,.66)); pointer-events:none; }
    #jlu-team-concept-v1 .jlu-hero-title { position:absolute; bottom:24px; left:clamp(22px,5cqw,72px); color:#fffaf5; margin:0; }
    #jlu-team-concept-v1 .jlu-hero-title span { display:block; font-size:16px; letter-spacing:.16em; }
    #jlu-team-concept-v1 .jlu-hero-title h1 { margin:5px 0 0; font-size:clamp(36px,5cqw,72px); line-height:1.08; font-weight:700; letter-spacing:.01em; }
    #jlu-team-concept-v1 .jlu-scroll-hint { position:absolute; bottom:28px; right:clamp(22px,5cqw,72px); padding:8px 0; color:#fffaf5; border:0; border-bottom:1px solid #fffaf5; background:transparent; }
    #jlu-team-concept-v1 .jlu-section { padding:76px clamp(18px,6cqw,80px) 24px; }
    #jlu-team-concept-v1 .jlu-heading { display:flex; justify-content:center; margin-bottom:38px; }
    #jlu-team-concept-v1 .jlu-heading h2 { display:inline-block; margin:0; padding:10px 38px; border:var(--jlu-title-border) solid var(--jlu-ink); color:var(--jlu-ink); font-size:29.333px; line-height:1.25; font-weight:700; text-align:center; background:var(--jlu-tan); }
    #jlu-team-concept-v1 .jlu-members { padding-inline:0; }
    #jlu-team-concept-v1 .jlu-filters { display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; padding:0 18px; margin:0 0 22px; }
    #jlu-team-concept-v1 .jlu-filter { border:0; background:transparent; color:var(--jlu-ink); padding:5px 3px; border-bottom:1px solid transparent; }
    #jlu-team-concept-v1 .jlu-filter[aria-pressed="true"] { border-bottom-color:var(--jlu-ink); font-weight:700; }
    #jlu-team-concept-v1 .jlu-carousel { position:relative; min-width:0; height:calc(var(--jlu-avatar) + 77px); overflow:hidden; touch-action:pan-y; }
    #jlu-team-concept-v1 .jlu-avatar-stage { height:100%; position:relative; }
    #jlu-team-concept-v1 .jlu-carousel::before,#jlu-team-concept-v1 .jlu-carousel::after { content:""; position:absolute; width:24px; top:0; bottom:0; z-index:2; pointer-events:none; }
    #jlu-team-concept-v1 .jlu-carousel::before { left:0; background:linear-gradient(90deg,var(--jlu-tan),transparent); }
    #jlu-team-concept-v1 .jlu-carousel::after { right:0; background:linear-gradient(-90deg,var(--jlu-tan),transparent); }
    #jlu-team-concept-v1 .jlu-avatar { position:absolute; top:5px; left:0; display:flex; flex-direction:column; align-items:center; gap:10px; width:calc(var(--jlu-avatar) + 32px); background:transparent; color:var(--jlu-ink); border:0; padding:4px 10px; }
    #jlu-team-concept-v1 .jlu-avatar img { width:var(--jlu-avatar); height:var(--jlu-avatar); border-radius:50%; border:2px solid rgba(111,78,55,.27); object-fit:cover; object-position:50% 28%; }
    #jlu-team-concept-v1 .jlu-avatar[aria-pressed="true"] img { border-color:var(--jlu-ink); outline:1px solid var(--jlu-ink); outline-offset:4px; }
    #jlu-team-concept-v1 .jlu-avatar span { text-align:center; font-size:16px; line-height:1.4; white-space:normal; }
    #jlu-team-concept-v1 .jlu-selection-controls { margin:6px auto 32px; display:flex; justify-content:center; align-items:center; gap:18px; color:var(--jlu-ink); }
    #jlu-team-concept-v1 .jlu-selection-controls button { width:44px; height:44px; padding:0; border:1px solid rgba(111,78,55,.4); background:transparent; color:var(--jlu-ink); border-radius:50%; font-size:22px; }
    #jlu-team-concept-v1 .jlu-selection-controls .jlu-play { width:auto; min-width:72px; font-size:16px; border:0; border-radius:0; }
    #jlu-team-concept-v1 .jlu-index { font-variant-numeric:tabular-nums; white-space:nowrap; }
    #jlu-team-concept-v1 .jlu-deck { position:relative; width:min(840px,calc(100% - 64px)); margin:0 auto 28px; isolation:isolate; }
    #jlu-team-concept-v1 .jlu-deck::before,#jlu-team-concept-v1 .jlu-deck::after { position:absolute; content:""; inset:0; border:1px solid rgba(111,78,55,.4); border-radius:22px; z-index:-1; background:#ebd6c4; pointer-events:none; }
    #jlu-team-concept-v1 .jlu-deck::before { transform:translate(9px,10px) rotate(1.5deg); }
    #jlu-team-concept-v1 .jlu-deck::after { transform:translate(-7px,5px) rotate(-1deg); background:#f1e0d1; }
    #jlu-team-concept-v1 .jlu-deck:has(details[open])::before { transform:translate(8px,8px); }
    #jlu-team-concept-v1 .jlu-deck:has(details[open])::after { transform:translate(-6px,4px); }
    #jlu-team-concept-v1 .jlu-profile { position:relative; padding:30px; background:var(--jlu-paper); border:2px solid var(--jlu-ink); border-radius:22px; box-shadow:0 16px 36px rgba(74,45,28,.1); }
    #jlu-team-concept-v1 .jlu-profile-layout { display:grid; grid-template-columns:minmax(180px,.85fr) minmax(0,1.5fr); gap:32px; align-items:start; }
    #jlu-team-concept-v1 .jlu-identity { min-width:0; }
    #jlu-team-concept-v1 .jlu-profile-photo { width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:14px; }
    #jlu-team-concept-v1 .jlu-profile-name { margin:18px 0 0; color:var(--jlu-ink); font-size:21.333px; line-height:1.2; text-align:center; font-weight:700; }
    #jlu-team-concept-v1 .jlu-profile-copy { min-width:0; }
    #jlu-team-concept-v1 .jlu-profile-role { margin:0 0 16px; font-weight:700; font-size:18.667px; color:var(--jlu-brown); }
    #jlu-team-concept-v1 .jlu-profile-bio { margin:0; font-size:16px; line-height:1.75; overflow-wrap:anywhere; }
    #jlu-team-concept-v1 .jlu-profile-quote { margin:20px 0 0; padding-left:16px; border-left:2px solid var(--jlu-line); font-size:16px; line-height:1.7; font-style:italic; }
    #jlu-team-concept-v1 .jlu-profile-quote[hidden] { display:none; }
    #jlu-team-concept-v1 .jlu-contribution { margin-top:24px; border-top:1px solid rgba(111,78,55,.26); }
    #jlu-team-concept-v1 .jlu-contribution > summary { color:var(--jlu-ink); padding:14px 0 0; cursor:pointer; }
    #jlu-team-concept-v1 .jlu-contribution h4 { font-size:18.667px; margin:22px 0 8px; line-height:1.35; font-weight:700; }
    #jlu-team-concept-v1 .jlu-contribution p { font-size:16px; line-height:1.75; margin:0; overflow-wrap:anywhere; }
    #jlu-team-concept-v1 .jlu-task { padding:14px 0; border-top:1px solid rgba(111,78,55,.18); }
    #jlu-team-concept-v1 .jlu-task h5 { font-size:18.667px; line-height:1.4; margin:0 0 8px; }
    #jlu-team-concept-v1 .jlu-people-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:28px; width:min(960px,100%); margin:0 auto; }
    #jlu-team-concept-v1 .jlu-static-person { min-width:0; text-align:center; }
    #jlu-team-concept-v1 .jlu-static-person > img { width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:14px; border:1px solid rgba(111,78,55,.28); }
    #jlu-team-concept-v1 .jlu-static-person h3 { font-size:21.333px; font-weight:700; margin:15px 0 4px; line-height:1.25; }
    #jlu-team-concept-v1 .jlu-static-person p { font-size:16px; margin:0; }
    #jlu-team-concept-v1 .jlu-advisors { padding-bottom:84px; }
    #jlu-team-concept-v1 .jlu-footer { padding:34px 22px; text-align:center; background:var(--jlu-ink); color:#f7e7d8; font-size:16px; }
    #jlu-team-concept-v1 .jlu-footer p { margin:0; }
    @container (max-width:600px) {
      #jlu-team-concept-v1 { --jlu-avatar:112px; }
      #jlu-team-concept-v1 .jlu-nav { justify-content:flex-start; gap:18px; font-size:16px; }
      #jlu-team-concept-v1 .jlu-hero-title { bottom:24px; }
      #jlu-team-concept-v1 .jlu-scroll-hint { bottom:30px; }
      #jlu-team-concept-v1 .jlu-hero-title h1 { font-size:36px; }
      #jlu-team-concept-v1 .jlu-section { padding-top:58px; }
      #jlu-team-concept-v1 .jlu-heading h2 { padding:9px 24px; }
      #jlu-team-concept-v1 .jlu-deck { width:calc(100% - 42px); }
      #jlu-team-concept-v1 .jlu-profile { padding:22px; border-radius:18px; }
      #jlu-team-concept-v1 .jlu-profile-layout { grid-template-columns:1fr; gap:22px; }
      #jlu-team-concept-v1 .jlu-identity { display:grid; grid-template-columns:112px minmax(0,1fr); align-items:center; gap:16px; }
      #jlu-team-concept-v1 .jlu-profile-name { margin:0; text-align:left; }
      #jlu-team-concept-v1 .jlu-profile-copy { padding:0; }
      #jlu-team-concept-v1 .jlu-people-grid { grid-template-columns:1fr; max-width:280px; gap:32px; }
      #jlu-team-concept-v1 .jlu-static-person > img { aspect-ratio:4/4.5; }
    }
    @media (prefers-reduced-motion:reduce) {
      #jlu-team-concept-v1 .jlu-scroll { scroll-behavior:auto; }
    }
  </style>

          </article>
        </div>
        <span class="jlu-status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></span>
      </section>
      <section class="jlu-section" aria-labelledby="jlu-pi-title"><div class="jlu-heading"><h2 id="jlu-pi-title">PI</h2></div><div class="jlu-people-grid" data-people="pi"></div></section>

    </main>
    <footer class="jlu-footer"><p>JLU-SPH iGEM Team · Jilin University</p></footer>

r data analysis in a more accurate and intuitive manner."},{"category":"Conceptualization","detail":"As a core team member involved in designing the overall project logic and drafting relevant content, I clarified the innovation and practical value of our project. I maintained close communication and coordination with teammates from the wet experiment, human practices, and hardware groups."},{"category":"Investigation","detail":"As one of the core members performing wet-lab operations and the leader of the wet-lab subgroup, I guided other wet-lab teammates to carry out relevant experiments. I mainly conducted experiments using the model plasmid of the respiratory syncytial virus (RSV) N gene, and performed result documentation, plotting and data analysis for all tested pathogens."},{"category":"Writing","detail":"I contributed to all Wiki content related to wet-lab work. Together with other subgroup leaders, I defined the structure of wet-lab sections on our Wiki. At the early stage, I drafted the outline for each section. During the mid-stage, I mainly wrote the Measurement, Design and Description sections. In the final phase, I reviewed and fine-tuned all wet-lab Wiki content for details."},{"category":"Safety","detail":"I strictly followed iGEM, university and biosafety guidelines during all wet-lab operations. I maintained safe handling of nucleic acid samples and reaction reagents, and helped the team implement standard laboratory safety practices."},{"category":"Notebook / Record Keeping","detail":"As a core member carrying out wet-lab operations, I continuously documented the reaction system and experimental results for every trial, and analyzed the outcomes obtained on the same day of each experiment."}],"image":"data:image/webp;base64,UklGRtBOAABXRUJQVlA4IMROAADwCQGdASoYAV4BPpk8l0gloyIhMBeuCLATCWNtEJB5T34YTgRQBhhHYXK6PtcatPsfQk8HPnvMR9879nqC/t28T54L08/4L0meqg6J71l/8la1HKn+H4M+bT7l/GejNj39/8DOp79rvHv5Kai/tzzEflv2z78LVP8x+1HsF+233fz6PzfNT+R9QH/AcP3+c9QX9Z+kno eam, I mainly worked in Human Practices, especially the design, writing, and Wiki presentation of the Integrated Human Practices section. With a clinical background, I tried to connect stakeholder feedback with the needs of patients, healthcare workers, and community settings. I also supported the Education and HP groups in activity planning, text writing, and WeChat public account editing, while helping coordinate communication among different subgroups.","quote":"Listening carefully and writing clearly turn human practices into real project direction.","generalTasks":["2","5","6","7","11","13"],"contributionCategories":["Conceptualization","Wiki Coding","Visualization","Writing","Project Administration","Public Engagement"],"tasks":[{"category":"Conceptualization","detail":"Contributed to the design of the IHP framework by organizing stakeholder needs, clinical perspectives, and project questions into a clear Human Practices storyline. Helped clarify how the project connected rapid respiratory pathogen detection with real clinical and community needs."},{"category":"Wiki Coding","detail":"Supported the construction and organization of IHP-related Wiki pages, including page structure, content placement, and coordination of materials for the Wiki presentation of Human Practices work."},{"category":"Visualization","detail":"Contributed to the visual presentation of IHP content on the Wiki, helping make stakeholder interviews, activity logic, and project feedback easier for readers to follow."},{"category":"Writing","detail":"Drafted, revised, and polished IHP documents and HP-related texts. Also assisted the Education and HP groups with activity descriptions, educational materials, and WeChat public account drafts."},{"category":"Project Administration","detail":"Participated in communication and coordination among different subgroups, helping align HP, Education, and Wiki materials with the team's overall project progress and documentation needs."},{"category":"Publ nity. See you at the Jamboree!","quote":"The best way to predict the future is to create it.","generalTasks":["1","2","6","7","8","11","13","14"],"contributionCategories":["Analysis","Conceptualization","Visualization","Writing","Safety","Project Administration","Public Engagement","Entrepreneurship"],"tasks":[{"category":"Analysis","detail":"Participated in collecting and analyzing data from HP activities, including questionnaire results and feedback from interviews with experts and the public, and translated stakeholder insights into concrete suggestions for project improvement."},{"category":"Conceptualization","detail":"Contributed to the overall Education framework and communication strategy, designing engagement activities that connect the rapid on-site detection system with real public needs and concerns."},{"category":"Visualization","detail":"Contributed to the design and layout of presentation slides, data visualization for HP results, and infographics used in science communication materials."},{"category":"Writing","detail":"Contributed to HP documentation, science communication articles, and wiki content describing the project's social value and engagement activities."},{"category":"Safety","detail":"Contributed to the Human Practices safety documentation, including the assessment of legal and regulatory risks, supporting the responsible, compliant, and standardized implementation of the project."},{"category":"Project Administration","detail":"Contributed to evaluation forms and application materials, experimental documentation, version control, and coordination of project materials and milestones."},{"category":"Public Engagement","detail":"Participated in project presentations and defense preparation, as well as science communication activities highlighting the potential application of the project in rapid on-site detection of respiratory pathogens."},{"category":"Entrepreneurship","detail":"Contributed to exploring the project's social impact and ent . I am Tong Li from the School of Public Health at Jilin University. I serve as a Wetlab member of our iGEM team this year. Working in the wet lab brings me precious practical experience and continuous challenges. I sincerely thank our instructors for guidance and all teammates for teamwork. I keep exploring and optimizing experiments for our project. I look forward to learning and progressing together with everyone in the iGEM community.","quote":"Among countless choices, walk towards yourself.","generalTasks":["1","3","4","7","9","10"],"contributionCategories":["Analysis","Background Research","Investigation","Writing","Data Curation","Notebook / Record Keeping"],"tasks":[{"category":"Analysis","detail":"Participated in analyzing experimental data, optimizing primer and crRNA screening conditions, and assisting dry lab for model fine-tuning and pathogen-specific gene searching."},{"category":"Background Research","detail":"Performed literature searching, collected crystal structure of Crisper-Cas12a and RSV structural diagrams to support our project background."},{"category":"Investigation","detail":"Took part in wet-lab experiments, discussed experimental details and validated our pathogen detection system."},{"category":"Writing","detail":"Contributed to part writing, drafted and revised Wiki background, principle and experimental technical sections."},{"category":"Data Curation","detail":"Organized datasets for dry lab, sorted sequence information and experimental results for team usage."},{"category":"Notebook / Record Keeping","detail":"Kept laboratory records, documented experimental optimization records and meeting notes during the whole journey."}],"image":"data:image/webp;base64,UklGRgQmAABXRUJQVlA4IPglAAAQ2gCdASoYAV4BPp1CnUilo6MhLLKcaLATiWMtgG5IXgEJpnkH5tfHpvSOcqhVaHjv8j/t/EH0O/aZnhyX8/3GDzfxKYS9NTyCIxr1d8IH5sIKi+gXKY1D6uNb/iPKdutLj2TnzdHuFHZyoqsR+cdBrXuGZm7/7TkcyNP+Nq/HeluSGDQypW/eBMy7Db/u03noTWHLYcyPGKEdlw6MywQYpyKhDfT/o54yDvVNyp+ebP7H21PJLSSVkhFLNQImh  labs."},{"category":"Investigation","detail":"Review relevant literature, extract parameters and research findings, and provide theoretical support for modeling and experimental schemes."},{"category":"Wiki Coding","detail":"Participate in building the team Wiki website, write and debug webpage codes, and develop the contribution section and data display pages."},{"category":"Visualization","detail":"Draw research flowcharts and model diagrams, visualize experimental results, and assist in visual design for Wiki and presentation slides."},{"category":"Public Engagement","detail":"Help draft popular science content, prepare presentation materials, and introduce the application value of our rapid pathogen detection project to the public."}],"image":"data:image/webp;base64,UklGRkYmAABXRUJQVlA4IDomAADQ4ACdASoYAV4BPplAm0glpCMhr1TcYLATCWUIkU4rDawGn+3/If1G+HUtWY0rF8wvD/0Lfcprdyn3gSTs+WBTBTpmeOjFlerf/F56xFlicH8bqoGVtmSoQxpLWBa1yBcIY35YnqfWdI85dBHMXcpl8mUiofjAou3w1uV+dpGSc/VoR4gKlqIgPsoJuWO5F4oSxqjhBhIhQ1rApb/jRnHBRLTHwbQ1CzE9rh1LeMlbJLL0A4xWIZbYrFG70oJJ+w9qQKJqhmihLyMrx88l7l38J2XevX4HiVTKqnfMbW9B+B4eYQAdFuPN+rr7oEOJPaKJ9Bts/6A0T8pz+SAf7pjLOFCgVL17e/Z54xSPxCHGg+16PZUzp3ILfBRORzk3A9KgfMpY+PeiRsWTOXTvkd4jlwY4fr8t9RhIRBCEytrizcj8CX31Cca99JZHYUzdLIHMJOa5vFNevwSjooAsEmWiMRgrkzDFCo6NZDtPUisjbw71d49FA7AYbAPyPwvQmU9kLKgQd+IYeOSpZjbB+6aPRCj/Qb3YWcG3j7d99BppBP7t5gG+6RKPPP0y+8mWALKvflO1LRzHc5ibU3OV0K5s0Xij5ygzPMgfSQRNTS6/X+wHEjdtbxngI47Z6/4uej43FFIyCehI0XXGDPoPWont08gXpaRU7+UfrZhbBhe2c8uVCxa9SosBYi388bx6NeHwBKWffUF7dHVK/6qJM8m/X9W6Cj7c4EPd363b3tc1llOQc5EoGc9Wfex6Q8fOJ44/wcNt6hJBJ5doXAugnVv1EZOD3WXykR3mq09r1bUjJT3Rzno5QjmlOZaEb1ba4OtMhx6c0dNgV7gh8yho2ue2/8cRpD3JwBFGmJF1XhsKHkeUhh9/IEimXb6M/afQGR7TPmlqFnjcwbpIlyGFwvxx70lAx6sOrJ7DY54Dz3Oi8lGSMNOOfISfeiFXvZKa4mNRqL0EUTxa+e7oXm0BA4RkMyMTWe52oT0T/zvpJMmJg9CmXi7WOExYBzQSWTSeV/D9/xG2wFOn4S4KhFIMWNc94SNWMBaucHleyThfQszLb66x9/kwbs1o1UFThABt7Wpu+AsMChRsS8xo1W1/zCzOOLhPn2PGiB0RLfyKlOYsFdtClJ2nynq6tvH4he5R08XRd2l0EB6+3QFCqbTMBGTkjl3bVjsB+9vMN6zmHo idation into a spiral closed-loop optimization framework for portable multiplex respiratory pathogen detection."},{"category":"Background Research","detail":"Provided guidance on literature review and study rationale, covering respiratory pathogens, RPA, CRISPR/Cas12a, DNABERT, molecular simulation, biosafety guidelines, and point-of-care testing."},{"category":"Safety","detail":"Advised on biosafety documentation, experimental standardization, and compliance with institutional and iGEM safety requirements, supporting safe and standardized implementation of experimental and testing procedures."},{"category":"Project Administration","detail":"Helped coordinate project planning, milestones, documentation, version control, evaluation forms, and application materials, and supported communication among team members; also reviewed and edited wiki, reports, and presentation materials."},{"category":"Public Engagement","detail":"Guided project presentations and defense preparation, highlighting the potential of the platform for rapid on-site detection of respiratory pathogens and its public health significance."}],"image":"data:image/webp;base64,UklGRpYrAABXRUJQVlA4IIorAACQ6wCdASoYAV4BPp1AnEolo6wmq1B96YATiU2r+RXACxSoq45uqfkv49nh9Yu7xNHnnOzsWeprccXe1Kz/hX+z8N/PL9X0dc//bHqWfN/0XkwZ1/M3UmgN0y/GQjIyCfqxf7/nt/PBFvuBg6lHQaythV4jJEY1xcszKS7rxBMZ+iGgCCRry5Fekn2gYStXBpxM/53d+AU87PcfFTCVC8jIsOVsB/9JPN0ZvsxnOctTaw6b3kvqKHZ5G4RB99Dptt2ORy+2xa2gj4/z64FLgapJDLWI90wOIZZBCsOha68bMpWdVxDBBVb7hTHKElfxfza6wAuupmCaotjeLoA8XcYH7+0HlcfLH4/nSZ4uJHP+5K0l7BwUne95MmND4QcbYVPMJry3yFKH7E8Wk/3tA28fD5R2BjtfntwuBiWOIasWuAMoQ6ktUd5usHwn3vCyzcklJUr027pl0a19ez/iSQgzfCuDr/Iy2jGM6xKHXAVZowy1JjOLIyjF/kE/ei3T2BSbyXRqtDWOC96nbY0nbrvpWJgl7ujoyRSTbzGmQOZokq8kYd5rYX5GlEv2WbxwnRh2KLjSBmxFLJBhZg78NR2T7y/SNZQlW37+zNx7DsgQZkNXWc4NFYT+Vwkpjg6XINW0iEmWE4SJb2ruZ/ZcITj/bsQvSGxotQicJ0OtEE7uRPHqFM+tAQ1lwxplyMVvM66gmEDr96ohLk+QXf0jWyMHQgnjvhDso/ySSD7guKEF8y5GBMlnnLSj4jZsPxiFsr/lBDtAhBdoZlRMj5j7wvbCUOBIPuxQWZs3AyDD7Q+VhBsDYx7x IqXd2dxUJkmp/otoxZOQ45gkCTHyJW4l8HQ6u+kUAAAA"},{"id":"sen-liang","name":"Sen Liang","role":"Advisor","groups":["Advisors"],"introduction":"I am Liang Sen, a PhD candidate from the School of Public Health at Jilin University. My research focuses on pathogen detection technologies, particularly the development and application of methods for detecting pathogenic microorganisms. As an advisor to the team, I assisted students with experimental work, coordinated research resources and experimental platforms, and provided guidance on modeling. I also supported the integration of experimental and computational approaches throughout the development of the respiratory pathogen detection project.","quote":"Rigorous science begins with careful thinking and grows through collaboration, exploration, and continuous improvement.","generalTasks":["1","2","4","11","15"],"contributionCategories":["Analysis","Conceptualization","Investigation","Project Administration","Hardware"],"tasks":[{"category":"Analysis","detail":"Provided guidance on the development and evaluation of the AI-assisted modeling approach used for primer design. Assisted the team in interpreting modeling results and considering their applicability to the RPA-CRISPR detection workflow."},{"category":"Conceptualization","detail":"Provided suggestions on the technical implementation of the project, particularly regarding the integration of AI-assisted primer design with the RPA-CRISPR detection system. Offered guidance on connecting computational design with subsequent experimental validation."},{"category":"Investigation","detail":"Assisted students in conducting and troubleshooting experiments related to the RPA-CRISPR-based respiratory pathogen detection system. Provided guidance during experimental implementation and helped the team improve the reliability and feasibility of experimental procedures."},{"category":"Project Administration","detail":"Coordinated research resources, experimental platforms, and other technical support required for the project. Helped facilitate access to laboratory facilities and supported the team in carrying out experimental validation and related project activities efficiently."},{"category":"Hardware","detail":"Provided guidance on the design and practical implementation of the detection device developed for the respiratory pathogen detection system. Offered suggestions on its functional integration with the RPA-CRISPR workflow and supported the team in improving the usability and feasibility of the device for on-site detection applications."}],"image":"data:image/webp;base64,UklGRqQqAABXRUJQVlA4IJgqAACw6QCdASoYAV4BPp1CnEglpCYjq/HdgMATiWVtk5WUx8CfxQDPd3PpZWr4KC5XXmD+78N/yT7B/i+bHnb7YNT7wTx88P/nRqNYw936EHf3frPh//OhQlrnnHVmF6Sb0HkHDAKMVJyM0j1MsCbCfD3TGOyncgjbeOtFc3ye/4jZiGVC4ygcmrr83GULVisTj+GYBkUW7psSBMSP70NWbi76stfVfn7/JGv2c694awWM50UXD7yfvgA9jCDMVHOgxQy9COl4eehY0o3gQF43yi4ZbOgpaMtjM2Q6z8eo0zC5/vDUTu0dySgWCFn5YbAWI+MZC6/7qUKHxvR+jYm3a/tE+ZSV+ma8GF3OFEhV36adJPpiyg0E+PtCQcKydkbXpG0rEjrD4jik8TNb3tgzJJP0ZoVClUpZxV9whLK7xHzPyFPIoX2OyjffLI2SQWTkiVB8E/lt/O4pg2WCMRocl/ChnvOh9ied+BRrgjuJyT/K9FbGiwGOdcQnooilNIFcsPHGXoV7oJ+Hl7I3wme0QavKfybyB+v96OuppEC397maqmD6gsDGICc5nS92DS7IPDuk4Dg3wxylqBdR0HZwAvm5Ji9LVDWHk3g0Bvc6cscfMX/SO/OZl0uBCHonprLuASyn3/wlPkZq01ml7xNdrn5V+fIqzw4OC6bGmnLzc1x/+W2/Pwb1xlSu5NgCAl1HJgfMx8uXEiPKcHJgYcmniE+o84fEUCZfQHiBiZkjMQKebxEPCLcCklS2sPo0jrTk5VKveqVb5GDuDg6Z8NgS69as3EL97kYf4TW8xWe6ank/fvAVtPUXCTiT/45zhlPf4JYynBqxEeUouv2KLny8goCsz0iNFU5ImAKHr35n+dN8AZz9AmarWovTmQ3/q9IRX97p1+S0JJhzMqKMR3CfJAjh1A12AxxzdseRxtEoQ/O4FguvGYM6yyahxOIyxFwuQnAUqJ7WZJHUI4IArdgYZO/rCXkLGadL0XWIKtlAagJZf7LnchC9n5soqZ8OT51zHyQSo/LuRA2S3xLc/vjrYXOFR8JuTC7sJQMKaJjDzajbdh8oKsP6Zg1vpyDBgiRkWmNpCUrmBU07NQJpPYURSG3TeC5mi3i1jI0TaRsDe+zERxgBu2OmEqK913d5a+31toqGHC7/PPfta6x8hpSi4m8FBCsKaNVCVNxTg0B54qtjW6l/JzSoNrRj2hnjAxfXuXUOOsdYN2sBh5sHFj+LTLoXg2sSi4xpq8oz3FtTvFBvSFI5aEVOlchPxCDCWiwjHAWPNTBrx4UIjJ8zLzXeFibAM2aWi/WmWD4BSJKkBjFjbrsk7YqkYm6RWrRbQdPn35Gj4SZ5zx/SNbNvJISNIXq3Sh   <script>
  (() => {
    const root = document.getElementById('jlu-team-concept-v1');
    const data = JSON.parse(root.querySelector('#jlu-team-concept-data').textContent);
    const scroller = root.querySelector('.jlu-scroll');
    const carousel = root.querySelector('.jlu-carousel');
    const stage = root.querySelector('.jlu-avatar-stage');
    const profile = root.querySelector('.jlu-profile');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
    const design = {avatarSize:132, borderWidth:2};
    let people = [...data.members], selected = 0, phase = 0, lastTime = 0, paused = false, hovered = false, focused = false;
    let avatarButtons = [], isVisible = false, frame = 0, drag = null;
    const create = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className=cls; if(text!==undefined)e.textContent=text; return e; };
    root.querySelectorAll('.jlu-group-photo,.jlu-group-backdrop').forEach(img => img.src = data.groupPhoto);
    const normalMod = (n, mod) => (n % mod + mod) % mod;
    function draw() {
      if(!avatarButtons.length) return;
      const avatar = parseFloat(getComputedStyle(root).getPropertyValue('--jlu-avatar')) || design.avatarSize;
      const pitch = avatar + 48, width = carousel.clientWidth, cycle = people.length * pitch;
      avatarButtons.forEach((button, i) => {
        const x = normalMod(i*pitch - phase + pitch, cycle) - pitch + 20;
        const visible = x > -pitch && x < width;
        button.style.transform = `translateX(${x}px)`;
        button.style.visibility = visible?'visible':'hidden';
        button.tabIndex = visible?0:-1;
      });
    }
    function fillProfile(person) {
      root.querySelector('.jlu-profile-photo').src = person.image;
      root.querySelector('.jlu-profile-photo').alt = `${person.name} portrait`;
      root.querySelector('.jlu-profile-name').textContent = person.name;
      root.querySelector('.jlu-profile-role').textContent = person.previewRole || person.role;
      root.querySelector('.jlu-profile-bio').textContent = person.introduction;
      const quote = root.querySelector('.jlu-profile-quote'); quote.textContent = person.quote?`“${person.quote}”`:''; quote.hidden=!person.quote;
      const details = root.querySelector('.jlu-contribution'); details.open=false;
      const body = root.querySelector('.jlu-contribution-body'); body.replaceChildren();
      if(person.generalTasks.length) body.append(create('h4','', 'General Tasks'), create('p','', `Source indices: ${person.generalTasks.join(' · ')}`));
      body.append(create('h4','','Specific Tasks'));
      person.tasks.forEach(task=>{const item=create('section','jlu-task');item.append(create('h5','',task.category),create('p','',task.detail));body.append(item);});
    }
    function choose(index, animate=true) {
      selected=normalMod(index,people.length); const person=people[selected];
      fillProfile(person);
      avatarButtons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selected)));
      root.querySelector('.jlu-index').textContent=`${String(selected+1).padStart(2,'0')} / ${people.length}`;
      root.querySelector('.jlu-status').textContent=`${person.name}, ${person.previewRole||person.role}`;
      profile.getAnimations().forEach(a=>a.cancel());
      if(animate && !reduce.matches)profile.animate([
        {transform:'translate(-46px, 14px) rotate(-3deg)',opacity:.45},
        {transform:'translate(7px, -2px) rotate(.5deg)',opacity:1,offset:.78},
        {transform:'translate(0, 0) rotate(0)',opacity:1}
      ],{duration:440,easing:'cubic-bezier(.2,.75,.2,1)'});
    }
    function buildAvatars() {
      stage.replaceChildren(); avatarButtons=[];
      people.forEach((person,i)=>{const b=create('button','jlu-avatar');b.type='button';b.dataset.personId=person.id;b.setAttribute('aria-label',`View ${person.name}`);b.setAttribute('aria-controls','jlu-profile-name');
        const image=create('img');image.src=person.image;image.alt='';image.draggable=false; b.append(image,create('span','',person.name));
        b.addEventListener('click',()=>{if(drag?.moved)return;choose(i);});stage.append(b);avatarButtons.push(b);
      });
      phase=0; selected=0; draw();choose(0,false);
    }
    root.querySelectorAll('.jlu-filter').forEach(b=>b.addEventListener('click',()=>{
      root.querySelectorAll('.jlu-filter').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      people=data.members.filter(p=>b.dataset.group==='All'||p.groups.includes(b.dataset.group));buildAvatars();
    }));
    root.querySelector('.jlu-prev').addEventListener('click',()=>{choose(selected-1);phase=selected*((parseFloat(getComputedStyle(root).getPropertyValue('--jlu-avatar'))||132)+48);draw();});
    root.querySelector('.jlu-next').addEventListener('click',()=>{choose(selected+1);phase=selected*((parseFloat(getComputedStyle(root).getPropertyValue('--jlu-avatar'))||132)+48);draw();});
    const play = root.querySelector('.jlu-play');
    play.addEventListener('click',()=>{paused=!paused;play.textContent=paused?'Play':'Pause';play.setAttribute('aria-pressed',String(paused));});
    carousel.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')hovered=true;});
    carousel.addEventListener('pointerleave',()=>{hovered=false;});
    carousel.addEventListener('focusin',()=>{focused=true;});carousel.addEventListener('focusout',()=>{focused=false;});
    carousel.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();choose(selected+(e.key==='ArrowRight'?1:-1));}});
    carousel.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;drag={x:e.clientX,y:e.clientY,start:phase,moved:false};});
    carousel.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)>9&&Math.abs(dx)>Math.abs(dy)){drag.moved=true;phase=drag.start-dx;draw();}});
    carousel.addEventListener('pointerup',()=>{if(drag?.moved){const old=drag;setTimeout(()=>{if(drag===old)drag=null;},0);}else drag=null;});
    carousel.addEventListener('pointercancel',()=>{drag=null;});
    const observer=new IntersectionObserver(entries=>{isVisible=entries[0].isIntersecting;},{root:scroller});observer.observe(carousel);
    function tick(time){if(lastTime && isVisible && !paused && !hovered && !focused && !drag && !reduce.matches && !document.hidden){phase+=(time-lastTime)*.025;draw();}lastTime=time;frame=requestAnimationFrame(tick);}
    function renderHero(){const h=scroller.clientHeight||680;root.style.setProperty('--jlu-view-height',`${h}px`);const progress=Math.min(1,Math.max(0,scroller.scrollTop/(h*.78)));root.style.setProperty('--jlu-hero-height',`${h*(1-.5*progress)}px`);}
    scroller.addEventListener('scroll',renderHero,{passive:true});
    root.querySelector('.jlu-scroll-hint').addEventListener('click',()=>{scroller.scrollTo({top:scroller.clientHeight*1.3,behavior:reduce.matches?'instant':'smooth'});});
    function staticPeople(list,kind){const host=root.querySelector(`[data-people="${kind}"]`);list.forEach(p=>{const item=create('article','jlu-static-person'),img=create('img');img.src=p.image;img.alt=`${p.name} portrait`;item.append(img,create('h3','',p.name),create('p','',p.role));host.append(item);});}
    staticPeople(data.pi,'pi');staticPeople(data.secondary,'secondary');staticPeople(data.advisors,'advisors');
    function renderDesign(){root.style.setProperty('--jlu-avatar',`${design.avatarSize}px`);root.style.setProperty('--jlu-title-border',`${design.borderWidth}px`);draw();}
    buildAvatars();renderHero();renderDesign();new ResizeObserver(()=>{renderHero();draw();}).observe(scroller);frame=requestAnimationFrame(tick);
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:renderDesign});tweak.addSlider(design,'avatarSize',{label:'头像尺寸',min:104,max:160,step:4,unit:'px'});tweak.addSlider(design,'borderWidth',{label:'标题框线条',min:1,max:3,step:1,unit:'px'});}
  })();
  </script>
</div>

</body>
</html>
