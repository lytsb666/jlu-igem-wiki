    #jlu-team-concept-v1 .jlu-static-person h3 { font-size:21.333px; font-weight:700; margin:15px 0 4px; line-height:1.25; }
    #jlu-team-concept-v1 .jlu-static-person p { font-size:16px; margin:0; }

    #jlu-team-concept-v1 .jlu-footer { padding:34px 22px; text-align:center; background:var(--jlu-ink); color:#f7e7d8; font-size:16px; }

    @container (max-width:600px) {

      #jlu-team-concept-v1 .jlu-hero-title h1 { font-size:36px; }
      #jlu-team-concept-v1 .jlu-section { padding-top:58px; }
      #jlu-team-concept-v1 .jlu-heading h2 { padding:9px 24px; }
      #jlu-team-concept-v1 .jlu-deck { width:calc(100% - 42px); }
      #jlu-team-concept-v1 .jlu-profile { padding:22px; border-radius:18px; }
      #jlu-team-concept-v1 .jlu-profile-layout { grid-template-columns:1fr; gap:22px; }
      #jlu-team-concept-v1 .jlu-identity { display:grid; grid-template-columns:112px minmax(0,1fr); align-items:center; gap:16px; }
      #jlu-team-concept-v1 .jlu-profile-name { margin:0; text-align:left; }

    @media (prefers-reduced-motion:reduce) {
      #jlu-team-concept-v1 .jlu-scroll { scroll-behavior:auto; }

  </style>
  <div class="jlu-scroll" aria-label="Team page preview">

  <script type="application/json" id="jlu-team-concept-data">__JLU_TEAM_DATA__</script>
  <script>
  (() => {
    const root = document.getElementById('jlu-team-concept-v1');
    const data = JSON.parse(root.querySelector('#jlu-team-concept-data').textContent);
    const scroller = root.querySelector('.jlu-scroll');
    const carousel = root.querySelector('.jlu-carousel');
    const stage = root.querySelector('.jlu-avatar-stage');
    const profile = root.querySelector('.jlu-profile');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
    const design = {avatarSize:132, borderWidth:2};
    let people = [...data.members], selected = 0, phase = 0, lastTime = 0, paused = false, hovered = false, focused = false;
    let avatarButtons = [], isVisible = false, frame = 0, drag = null;
    const create = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className=cls; if(text!==undefined)e.textContent=text; return e; };
    root.querySelectorAll('.jlu-group-photo,.jlu-group-backdrop').forEach(img => img.src = data.groupPhoto);
    const normalMod = (n, mod) => (n % mod + mod) % mod;
    function draw() {
      if(!avatarButtons.length) return;
      const avatar = parseFloat(getComputedStyle(root).getPropertyValue('--jlu-avatar')) || design.avatarSize;
      const pitch = avatar + 48, width = carousel.clientWidth, cycle = people.length * pitch;
      avatarButtons.forEach((button, i) => {
        const x = normalMod(i*pitch - phase + pitch, cycle) - pitch + 20;
        const visible = x > -pitch && x < width;
        button.style.transform = `translateX(${x}px)`;
        button.style.visibility = visible?'visible':'hidden';
        button.tabIndex = visible?0:-1;
      });
    }
    function fillProfile(person) {
      root.querySelector('.jlu-profile-photo').src = person.image;
      root.querySelector('.jlu-profile-photo').alt = `${person.name} portrait`;
      root.querySelector('.jlu-profile-name').textContent = person.name;
      root.querySelector('.jlu-profile-role').textContent = person.previewRole || person.role;
      root.querySelector('.jlu-profile-bio').textContent = person.introduction;
      const quote = root.querySelector('.jlu-profile-quote'); quote.textContent = person.quote?`“${person.quote}”`:''; quote.hidden=!person.quote;
      const details = root.querySelector('.jlu-contribution'); details.open=false;
      const body = root.querySelector('.jlu-contribution-body'); body.replaceChildren();
      if(person.generalTasks.length) body.append(create('h4','', 'General Tasks'), create('p','', `Source indices: ${person.generalTasks.join(' · ')}`));
      body.append(create('h4','','Specific Tasks'));
      person.tasks.forEach(task=>{const item=create('section','jlu-task');item.append(create('h5','',task.category),create('p','',task.detail));body.append(item);});
    }
    function choose(index, animate=true) {
      selected=normalMod(index,people.length); const person=people[selected];
      fillProfile(person);
      avatarButtons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selected)));
      root.querySelector('.jlu-index').textContent=`${String(selected+1).padStart(2,'0')} / ${people.length}`;
      root.querySelector('.jlu-status').textContent=`${person.name}, ${person.previewRole||person.role}`;
      profile.getAnimations().forEach(a=>a.cancel());
      if(animate && !reduce.matches)profile.animate([
        {transform:'translate(-46px, 14px) rotate(-3deg)',opacity:.45},
        {transform:'translate(7px, -2px) rotate(.5deg)',opacity:1,offset:.78},
        {transform:'translate(0, 0) rotate(0)',opacity:1}
      ],{duration:440,easing:'cubic-bezier(.2,.75,.2,1)'});
    }
    function buildAvatars() {
      stage.replaceChildren(); avatarButtons=[];
      people.forEach((person,i)=>{const b=create('button','jlu-avatar');b.type='button';b.dataset.personId=person.id;b.setAttribute('aria-label',`View ${person.name}`);b.setAttribute('aria-controls','jlu-profile-name');
        const image=create('img');image.src=person.image;image.alt='';image.draggable=false; b.append(image,create('span','',person.name));
        b.addEventListener('click',()=>{if(drag?.moved)return;choose(i);});stage.append(b);avatarButtons.push(b);
      });
      phase=0; selected=0; draw();choose(0,false);
    }
    root.querySelectorAll('.jlu-filter').forEach(b=>b.addEventListener('click',()=>{
      root.querySelectorAll('.jlu-filter').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      people=data.members.filter(p=>b.dataset.group==='All'||p.groups.includes(b.dataset.group));buildAvatars();
    }));
    root.querySelector('.jlu-prev').addEventListener('click',()=>{choose(selected-1);phase=selected*((parseFloat(getComputedStyle(root).getPropertyValue('--jlu-avatar'))||132)+48);draw();});
    root.querySelector('.jlu-next').addEventListener('click',()=>{choose(selected+1);phase=selected*((parseFloat(getComputedStyle(root).getPropertyValue('--jlu-avatar'))||132)+48);draw();});
    const play = root.querySelector('.jlu-play');
    play.addEventListener('click',()=>{paused=!paused;play.textContent=paused?'Play':'Pause';play.setAttribute('aria-pressed',String(paused));});
    carousel.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')hovered=true;});
    carousel.addEventListener('pointerleave',()=>{hovered=false;});
    carousel.addEventListener('focusin',()=>{focused=true;});carousel.addEventListener('focusout',()=>{focused=false;});
    carousel.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();choose(selected+(e.key==='ArrowRight'?1:-1));}});
    carousel.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;drag={x:e.clientX,y:e.clientY,start:phase,moved:false};});
    carousel.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)>9&&Math.abs(dx)>Math.abs(dy)){drag.moved=true;phase=drag.start-dx;draw();}});
    carousel.addEventListener('pointerup',()=>{if(drag?.moved){const old=drag;setTimeout(()=>{if(drag===old)drag=null;},0);}else drag=null;});
    carousel.addEventListener('pointercancel',()=>{drag=null;});
    const observer=new IntersectionObserver(entries=>{isVisible=entries[0].isIntersecting;},{root:scroller});observer.observe(carousel);
    function tick(time){if(lastTime && isVisible && !paused && !hovered && !focused && !drag && !reduce.matches && !document.hidden){phase+=(time-lastTime)*.025;draw();}lastTime=time;frame=requestAnimationFrame(tick);}
    function renderHero(){const h=scroller.clientHeight||680;root.style.setProperty('--jlu-view-height',`${h}px`);const progress=Math.min(1,Math.max(0,scroller.scrollTop/(h*.78)));root.style.setProperty('--jlu-hero-height',`${h*(1-.5*progress)}px`);}
    scroller.addEventListener('scroll',renderHero,{passive:true});
    root.querySelector('.jlu-scroll-hint').addEventListener('click',()=>{scroller.scrollTo({top:scroller.clientHeight*1.3,behavior:reduce.matches?'instant':'smooth'});});
    function staticPeople(list,kind){const host=root.querySelector(`[data-people="${kind}"]`);list.forEach(p=>{const item=create('article','jlu-static-person'),img=create('img');img.src=p.image;img.alt=`${p.name} portrait`;item.append(img,create('h3','',p.name),create('p','',p.role));host.append(item);});}
    staticPeople(data.pi,'pi');staticPeople(data.secondary,'secondary');staticPeople(data.advisors,'advisors');
    function renderDesign(){root.style.setProperty('--jlu-avatar',`${design.avatarSize}px`);root.style.setProperty('--jlu-title-border',`${design.borderWidth}px`);draw();}
    buildAvatars();renderHero();renderDesign();new ResizeObserver(()=>{renderHero();draw();}).observe(scroller);frame=requestAnimationFrame(tick);
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:renderDesign});tweak.addSlider(design,'avatarSize',{label:'头像尺寸',min:104,max:160,step:4,unit:'px'});tweak.addSlider(design,'borderWidth',{label:'标题框线条',min:1,max:3,step:1,unit:'px'});}
  })();
