name: Wiki CI and Pages

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: wiki-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check code-owner binding on PRs
        if: github.event_name == 'pull_request'
        run: node scripts/configure-codeowners.mjs --check
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pages-client
          path: dist/client/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: pages-deploy
    needs: build
    if: >-
      vars.PAGES_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'pull_request' && 'pages-preview' || 'pages-production' }}
      url: ${{ steps.upload.outputs.url }}
    steps:
      # Deploy only the artifact; do not execute PR build scripts with secrets.
      - uses: actions/download-artifact@v4
        with:
          name: pages-client
          path: pages-client
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - name: Validate static upload boundary
        shell: bash
        run: |
          test -f pages-client/index.html
          if find pages-client -type l -print -quit | grep -q .; then
            echo 'Symlinks are not permitted'; exit 1
          fi
          if find pages-client \( -name '.*' -o -name '_worker.js' -o -name 'functions' -o -name '*.map' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Only public static assets may be uploaded'; exit 1
          fi
          if find pages-client -type f -size +26214400c -print -quit | grep -q .; then
            echo 'Pages asset exceeds 25 MiB'; exit 1
          fi
          test "$(find pages-client -type f | wc -l)" -le 20000
      - name: Upload to existing Pages project
        id: upload
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
          PAGES_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          DEPLOY_SHA: ${{ github.sha }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Configure the Environment secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure the account variable}"
          : "${PAGES_PROJECT_NAME:?Configure the project variable}"
          npx --yes wrangler@4.149.0 pages deploy pages-client \
            --project-name "$PAGES_PROJECT_NAME" --branch "$PAGES_BRANCH" \
            --commit-hash "$DEPLOY_SHA" --commit-dirty=false 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | head -n 1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf 'Pages branch: `%s`\n\n[View deployment](%s)\n' "$PAGES_BRANCH" "$url" >> "$GITHUB_STEP_SUMMARY"
